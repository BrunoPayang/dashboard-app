services:
  - type: web
    name: school-dashboard-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # SPA configuration
    spa: true
    # Fallback for all routes
    fallback: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: REACT_APP_API_BASE_URL
        value: https://schoolconnect-qeaf.onrender.com/api
      - key: REACT_APP_APP_NAME
        value: School Dashboard
      - key: REACT_APP_APP_VERSION
        value: 1.0.0
      - key: REACT_APP_ENABLE_ANALYTICS
        value: true
      - key: REACT_APP_ENABLE_DEBUG_MODE
        value: false
